name: build-exe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyinstaller
      - run: pyinstaller --onefile --noconsole --name DentamapAuto dentamap_auto.py
      - uses: actions/upload-artifact@v4
        with:
          name: DentamapAuto
          path: dist/DentamapAuto.exe
